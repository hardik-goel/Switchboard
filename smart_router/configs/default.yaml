providers:
  openai:
    enabled: true
    settings:
      timeout_seconds: 30
      max_retries: 2
    models:
      - name: gpt-5.4
        max_input_tokens: 128000
        max_output_tokens: 16384
        latency_tier: medium
        reasoning_tier: high
        cost_per_1k_input: 0.01
        cost_per_1k_output: 0.03
  anthropic:
    enabled: true
    models:
      - name: claude-sonnet
        max_input_tokens: 200000
        max_output_tokens: 8192
        latency_tier: medium
        reasoning_tier: high
        cost_per_1k_input: 0.009
        cost_per_1k_output: 0.03
routing:
  default_provider: openai
  fallback_order: [anthropic]
  max_cost_per_request: 2.0
