[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-router"
version = "0.1.0"
description = "Production-grade modular AI routing/orchestration CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "httpx>=0.27.0"
]

[project.scripts]
smart-router = "smart_router.cli.main:app"
switchboard = "smart_router.cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["smart_router/tests", "tests"]

[tool.setuptools.packages.find]
include = ["smart_router*"]
